name: Deploy dbt Bundle

on:
  push:
    branches: [main]
    paths:
      - 'dbt_projects/retailx_dbt/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets are set
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "❌ DATABRICKS_HOST is empty or missing"
          else
            echo "✅ DATABRICKS_HOST is set (length: ${#DATABRICKS_HOST})"
          fi
          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "❌ DATABRICKS_TOKEN is empty or missing"
          else
            echo "✅ DATABRICKS_TOKEN is set (length: ${#DATABRICKS_TOKEN})"
            if [[ "$DATABRICKS_TOKEN" == dapi* ]]; then
              echo "✅ Token starts with 'dapi' (looks like a Databricks PAT)"
            else
              echo "⚠️ Token does NOT start with 'dapi' — may be wrong type"
            fi
          fi

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sudo sh

      - name: Deploy dbt bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          cd dbt_projects/retailx_dbt
          databricks bundle deploy --target dev