bundle:
  name: retailx-capstone

workspace:
  host: https://dbc-1dda8b01-b539.cloud.databricks.com

resources:
  jobs:
    retailx_daily_pipeline:
      name: "RetailX Daily Pipeline"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./src/bronze.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./src/silver.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./src/gold.py
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"
      #   timezone_id: "UTC"

targets:
  dev:
    workspace:
      host: https://dbc-1dda8b01-b539.cloud.databricks.com
